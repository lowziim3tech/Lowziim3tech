<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">LowziiOfficial — MeTech Developer</title>
  <desc id="desc">Minimal animated profile banner for LowziiOfficial, MeTech Developer and founder of MeTech.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816" />
      <stop offset="0.52" stop-color="#11102b" />
      <stop offset="1" stop-color="#061824" />
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#f6d365" />

      <animate
        attributeName="x1"
        values="0;1;0"
        dur="8s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="x2"
        values="1;2;1"
        dur="8s"
        repeatCount="indefinite"
      />
    </linearGradient>

    <linearGradient id="nameColor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#dbeafe" />
      <stop offset="1" stop-color="#fef3c7" />
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <clipPath id="panelClip">
      <rect x="8" y="8" width="1184" height="324" rx="38" />
    </clipPath>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur" />

      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect
    x="8"
    y="8"
    width="1184"
    height="324"
    rx="38"
    fill="url(#background)"
  />

  <g clip-path="url(#panelClip)">
    <circle cx="130" cy="65" r="230" fill="url(#purpleGlow)">
      <animate
        attributeName="cx"
        values="130;210;130"
        dur="10s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="cy"
        values="65;105;65"
        dur="12s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="1080" cy="280" r="245" fill="url(#cyanGlow)">
      <animate
        attributeName="cx"
        values="1080;995;1080"
        dur="11s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="cy"
        values="280;235;280"
        dur="13s"
        repeatCount="indefinite"
      />
    </circle>

    <rect
      x="-300"
      y="8"
      width="170"
      height="324"
      fill="url(#shine)"
      transform="skewX(-18)"
    >
      <animate
        attributeName="x"
        values="-300;1400"
        dur="8s"
        repeatCount="indefinite"
      />
    </rect>
  </g>

  <rect
    x="8"
    y="8"
    width="1184"
    height="324"
    rx="38"
    fill="none"
    stroke="url(#accent)"
    stroke-width="2"
  />

  <rect
    x="16"
    y="16"
    width="1168"
    height="308"
    rx="31"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.06"
  />

  <circle
    cx="600"
    cy="52"
    r="5"
    fill="#22d3ee"
    filter="url(#softGlow)"
  >
    <animate
      attributeName="r"
      values="4;7;4"
      dur="2.2s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="1;0.45;1"
      dur="2.2s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="600"
    y="145"
    text-anchor="middle"
    fill="url(#nameColor)"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="76"
    font-weight="800"
    letter-spacing="3"
  >
    LowziiOfficial
  </text>

  <text
    x="600"
    y="191"
    text-anchor="middle"
    fill="#cbd5e1"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="21"
    font-weight="600"
    letter-spacing="4"
  >
    MeTech Developer
  </text>

  <line
    x1="425"
    y1="221"
    x2="775"
    y2="221"
    stroke="url(#accent)"
    stroke-width="2"
    stroke-linecap="round"
  />

  <g transform="translate(410 244)">
    <rect
      width="380"
      height="48"
      rx="24"
      fill="#020617"
      fill-opacity="0.58"
      stroke="#ffffff"
      stroke-opacity="0.14"
    />

    <text
      x="190"
      y="30"
      text-anchor="middle"
      fill="#fef3c7"
      font-family="Inter, Segoe UI, Arial, sans-serif"
      font-size="13"
      font-weight="700"
      letter-spacing="2.2"
    >
      FOUNDER OF METECH · 3K+ MEMBERS
    </text>
  </g>

  <text
    x="600"
    y="316"
    text-anchor="middle"
    fill="#64748b"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="4"
  >
    TECHNOLOGY · AUTOMATION · COMMUNITY
  </text>
</svg>
